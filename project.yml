name: Quickdress
options:
  bundleIdPrefix: edu.aucegypt.quickdress
  deploymentTarget:
    iOS: "17.0"
packages:
  QuickdressCore:
    path: QuickdressCore
  StoragePlugins:
    path: StoragePlugins
targets:
  Quickdress:
    type: application
    platform: iOS
    sources:
      - Quickdress
    dependencies:
      - package: QuickdressCore
      - package: StoragePlugins
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.aucegypt.quickdress
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quickdress
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
